; SNOWPACK reference run at the BYK validation points, driven by the same
; station-corrected hourly forcing as our model. Fixed design:
;   hourly UTC SMET forcing (TA RH VW DW ISWR ILWR PSUM PSUM_PH TSG HS), no soil,
;   ground held at 0 degC through TSG, incoming SW + measured ILWR, flat column
;   plus four 38 deg virtual slopes (N E S W) with snow redistribution, 15 min
;   steps, PRO profiles and SMET time series every 3 h.
; run.sh writes a tiny per-run ini that IMPORT_BEFOREs this file and overrides
; the per-point keys (paths, ENFORCE_MEASURED_SNOW_HEIGHTS); the station id and
; the dates come from the command line (-s, -b, -e). Nothing else varies.

[General]
BUFFER_SIZE = 370
BUFF_BEFORE = 1.5

[Input]
COORDSYS = UTM
COORDPARAM = 11U     ; all BYK points lie in UTM zone 11
TIME_ZONE = 0
METEO = SMET
METEOPATH = ./input  ; run.sh: <smet-dir>/<season>, holding <id>.smet
SNOW = SMET
SNOWPATH = ./input   ; run.sh: <out-dir>/<season>/sno, holding <id>.sno, <id>1.sno .. <id>4.sno
SLOPE_FROM_SNO = true

[Output]
COORDSYS = UTM
COORDPARAM = 11U
TIME_ZONE = 0
METEOPATH = ./output ; run.sh: <out-dir>/<season>
EXPERIMENT = byk     ; output names: <id>_byk.pro, <id>1_byk.pro, ..., <id>_byk.smet
METEO = SMET
SNOW = SMET
SNOW_WRITE = false
HAZ_WRITE = false
ACDD_WRITE = false
; 0.125 d = 3 h
TS_WRITE = true
TS_FORMAT = SMET
TS_START = 0.0
TS_DAYS_BETWEEN = 0.125
PROF_WRITE = true
PROF_FORMAT = PRO
AGGREGATE_PRO = false
PROF_START = 0.0
PROF_DAYS_BETWEEN = 0.125
PROF_ID_OR_MK = MK           ; 0504 = element marker (crust/SH/FC flags), not element id
PROF_AGE_OR_DATE = AGE       ; 0505 = element age in days
HARDNESS_IN_NEWTON = false   ; 0534 = hand hardness index 1..6 (written negative)

[Snowpack]
MEAS_TSS = false
ENFORCE_MEASURED_SNOW_HEIGHTS = false ; run.sh: true at station points with a snow-height sensor
SW_MODE = INCOMING
HEIGHT_OF_WIND_VALUE = 10
HEIGHT_OF_METEO_VALUES = 2
ATMOSPHERIC_STABILITY = MO_HOLTSLAG
ROUGHNESS_LENGTH = 0.002
CALCULATION_STEP_LENGTH = 15.0 ; must match PSUM::arg1::period below (900 s)
CHANGE_BC = false
THRESH_CHANGE_BC = -1.0
SNP_SOIL = false
SOIL_FLUX = false      ; bottom boundary is the TSG temperature (273.15 K in the SMET)
GEO_HEAT = 0.06
CANOPY = false

[SnowpackAdvanced]
VARIANT = DEFAULT
; The forcing is NWP/station weather at fixed heights above the ground, not a
; sensor on a mast that the snow surface approaches: keep the heights fixed.
ADJUST_HEIGHT_OF_METEO_VALUES = false
ADJUST_HEIGHT_OF_WIND_VALUE = false
; New-snow element thickness, m. SNOWPACK's default is 0.02 with measured snow
; heights enforced but 0.005 when precipitation driven, which quadruples the
; element count, the run time and the PRO size (~430 MB per point-season). One
; value for both kinds of run keeps the layering comparable between them.
HEIGHT_NEW_ELEM = 0.02
NUMBER_SLOPES = 5          ; sector 0 flat (main), 1 N, 2 E, 3 S, 4 W (azimuth from the .sno files)
SNOW_REDISTRIBUTION = true ; windward slope erodes, lee slope receives
SNOW_EROSION = HS_DRIVEN   ; flat column erodes only where a measured HS says so; a no-op without HS
PREVAILING_WIND_DIR = 0.
HN_DENSITY = PARAMETERIZED
HN_DENSITY_PARAMETERIZATION = LEHNING_NEW
HARDNESS_PARAMETERIZATION = MONTI
MEAS_INCOMING_LONGWAVE = true
WATERTRANSPORTMODEL_SNOW = BUCKET

[Filters]
; Hard bounds reject (-> nodata, then interpolated), soft bounds clamp.
; Ranges suit a Rockies winter: TA down to -50 degC, clear-sky ILWR near 110 W/m2.
PSUM::filter1 = min
PSUM::arg1::soft = true
PSUM::arg1::min = 0.0

PSUM_PH::filter1 = min_max
PSUM_PH::arg1::soft = true
PSUM_PH::arg1::min = 0.0
PSUM_PH::arg1::max = 1.0

TA::filter1 = min_max
TA::arg1::min = 220
TA::arg1::max = 320

RH::filter1 = min_max
RH::arg1::min = 0.01
RH::arg1::max = 1.2
RH::filter2 = min_max
RH::arg2::soft = true
RH::arg2::min = 0.05
RH::arg2::max = 1.0

ISWR::filter1 = min_max
ISWR::arg1::min = -10
ISWR::arg1::max = 1500
ISWR::filter2 = min_max
ISWR::arg2::soft = true
ISWR::arg2::min = 0
ISWR::arg2::max = 1500

ILWR::filter1 = min_max
ILWR::arg1::min = 80
ILWR::arg1::max = 600
ILWR::filter2 = min_max
ILWR::arg2::soft = true
ILWR::arg2::min = 100
ILWR::arg2::max = 500

TSG::filter1 = min_max
TSG::arg1::min = 200
TSG::arg1::max = 320

HS::filter1 = min
HS::arg1::soft = true
HS::arg1::min = 0.0
HS::filter2 = rate
HS::arg2::max = 5.55e-5 ; 0.20 m/h

VW::filter1 = min_max
VW::arg1::min = -2
VW::arg1::max = 70
VW::filter2 = min_max
VW::arg2::soft = true
VW::arg2::min = 0.0
VW::arg2::max = 50.0

[Generators]
; A step with no wind direction would stop the run (the virtual slopes need
; DW_DRIFT); a gap longer than MAX_GAP_SIZE falls back to the prevailing westerly.
DW::generator1 = CST
DW::arg1::value = 270

[Interpolations1D]
MAX_GAP_SIZE = 86400

PSUM::resample1 = accumulate ; re-accumulate hourly totals over the 15 min step
PSUM::arg1::period = 900

; With ENFORCE_MEASURED_SNOW_HEIGHTS SNOWPACK stops at the first step without an
; HS value, so export-smet.mjs writes a gap-free HS column (0 before the first
; accepted reading, linear across gaps, held after the last); this resampling
; only bridges the hourly rows to the 15 min steps.
HS::resample1 = linear
HS::arg1::MAX_GAP_SIZE = 43200

VW::resample1 = nearest
VW::arg1::extrapolate = true

DW::resample1 = nearest
DW::arg1::extrapolate = true
